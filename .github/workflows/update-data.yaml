name: Update Java release data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'
permissions:
  contents: write
jobs:
  update:
    if: github.repository == 'hueys/asdf-java'
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y curl
    - name: Install jq 1.6
      run: |
        curl -Lo jq https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64
        chmod +x jq
        jq --version
    - name: Run update script
      env:
        GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export PATH=".:$PATH"
        ./update_data.bash
    - name: Open pull request
      env:
        GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
      run: |
        git add data/*.tsv
        git clean -f
        if git diff --cached --quiet; then
          echo "No changes to Java release data"
          exit 0
        fi
        branch="update-data-$(date -u +%Y%m%d%H%M)"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git checkout -b "$branch"
        git commit -m "Update Java release data"
        git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
        gh pr create --base master --head "$branch" \
          --title "Update Java release data" \
          --body "Automated update from the scheduled workflow."
        gh pr merge "$branch" --rebase --auto --delete-branch
