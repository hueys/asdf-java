name: Update Java release data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'
permissions:
  contents: write
jobs:
  update:
    if: github.repository == 'hueys/asdf-java'
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      with:
        token: ${{ secrets.UPDATE_TOKEN }}
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y curl
    - name: Install jq 1.6
      run: |
        curl -Lo jq https://github.com/stedolan/jq/releases/download/jq-1.6/jq-linux64
        chmod +x jq
        jq --version
    - name: Run update script
      env:
        GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export PATH=".:$PATH"
        ./update_data.bash
    - name: Open pull request
      env:
        GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
      run: |
        git add data/*.tsv
        git clean -f
        if git diff --cached --quiet; then
          echo "No changes to Java release data"
          exit 0
        fi
        branch="update-data-$(date -u +%Y%m%d%H%M)"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git checkout -b "$branch"
        git commit -m "Update Java release data"
        git push origin "$branch"
        gh pr create --base master --head "$branch" \
          --title "Update Java release data" \
          --body "Automated update from the scheduled workflow."
        gh pr merge "$branch" --squash --auto --delete-branch
