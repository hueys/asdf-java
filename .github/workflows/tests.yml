name: asdf-java Tests
on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macOS-latest']
    env:
      TERM: dumb
    steps:
    - uses: actions/checkout@v4
    - uses: mstksg/get-package@v1
      with:
        brew: bash coreutils jq shellcheck
        apt-get: jq shellcheck
    - name: Run ShellCheck
      run: |
        shellcheck -V
        shellcheck ./bin/functions
        shellcheck ./update_data.bash
    - name: Install asdf
      uses: actions/checkout@v4
      with:
        repository: asdf-vm/asdf
        path: asdf
    - name: Run tests
      env:
        GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        . asdf/asdf.sh
        asdf plugin-test java "$GITHUB_WORKSPACE" --asdf-plugin-gitref "$GITHUB_SHA" --asdf-tool-version "temurin-21.0.8+9.0.LTS" java -version
    - name: Check update_data.bash
      env:
        GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./update_data.bash
        grep -q "^temurin-11\." data/jdk-linux-x86_64.tsv
        echo "Found temurin-11"
        grep -q "^temurin-jre-11\." data/jdk-macosx-x86_64.tsv
        echo "Found temurin-jre-11"
        grep -q "^temurin-musl-11\." data/jdk-linux-x86_64.tsv
        echo "Found temurin-musl-11"
        ! grep -qi "adoptopenjdk\|zulu\|liberica\|graalvm\|corretto" data/jdk-linux-x86_64.tsv
        echo "Confirmed only temurin releases are present"
    - name: macOS Check java_home integration
      env:
        GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export ASDF_CONFIG_FILE=${HOME}"/.asdfrc"
        echo "java_macos_integration_enable = yes" > "${ASDF_CONFIG_FILE}"
        . asdf/asdf.sh
        asdf plugin-test java "$GITHUB_WORKSPACE" --asdf-plugin-gitref "$GITHUB_SHA" --asdf-tool-version "temurin-8.0.504+1" /usr/libexec/java_home -V 2>&1 | grep "Eclipse Adoptium"
      if: matrix.os == 'macOS-latest'
