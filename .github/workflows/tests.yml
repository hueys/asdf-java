name: asdf-java Tests
on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macOS-latest']
    env:
      TERM: dumb
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Install dependencies
      run: |
        case "$(uname -s)" in
            Darwin) brew install bash coreutils jq shellcheck ;;
            Linux) sudo apt-get update && sudo apt-get install -y jq shellcheck ;;
        esac
    - name: Run ShellCheck
      run: |
        shellcheck -V
        shellcheck ./bin/functions
        shellcheck ./update_data.bash
    - name: Run zizmor
      if: matrix.os == 'ubuntu-latest'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pip install "zizmor==1.31.1"
        zizmor --format=github .github/workflows/
    - name: Install asdf
      run: |
        ASDF_VERSION=v0.20.2
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "${ARCH}" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
        esac
        curl -sSL -o asdf.tar.gz "https://github.com/asdf-vm/asdf/releases/download/${ASDF_VERSION}/asdf-${ASDF_VERSION}-${OS}-${ARCH}.tar.gz"
        tar xzf asdf.tar.gz
        sudo mv asdf /usr/local/bin/asdf
        rm asdf.tar.gz
        asdf version
    - name: Run tests
      env:
        GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        asdf plugin add java "$GITHUB_WORKSPACE"
        asdf install java "temurin-21.0.8+9.0.LTS"
        asdf set java "temurin-21.0.8+9.0.LTS"
        asdf exec java -version
        asdf latest java | grep -q "^temurin-[0-9]"
        asdf latest java temurin-11 | grep -q "^temurin-11\."
    - name: Check update_data.bash
      env:
        GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./update_data.bash
        grep -q "^temurin-11\." data/jdk-linux-x86_64.tsv
        echo "Found temurin-11"
        grep -q "^temurin-jre-11\." data/jdk-macosx-x86_64.tsv
        echo "Found temurin-jre-11"
        grep -q "^temurin-musl-11\." data/jdk-linux-x86_64.tsv
        echo "Found temurin-musl-11"
        ! grep -qi "adoptopenjdk\|zulu\|liberica\|graalvm\|corretto" data/jdk-linux-x86_64.tsv
        echo "Confirmed only temurin releases are present"
    - name: macOS Check java_home integration
      env:
        GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export ASDF_CONFIG_FILE=${HOME}"/.asdfrc"
        echo "java_macos_integration_enable = yes" > "${ASDF_CONFIG_FILE}"
        asdf install java "temurin-21.0.8+9.0.LTS"
        /usr/libexec/java_home -V 2>&1 | grep "Eclipse Adoptium"
      if: matrix.os == 'macOS-latest'
